name: ci

# The gates, run where they can fail in front of someone.
#
# The README says the openCypher conformance number is "CI-ratcheted" and that
# CI builds on the pinned MSRV. Until this file existed, neither was true —
# the gates were `cargo xtask` subcommands nobody ran on a schedule. A claim
# nothing checks is a preference.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The benchmark harness is a MEASURING INSTRUMENT, and an instrument nobody
  # exercises drifts without saying so. Every sweep in `docs/bench/` is a
  # hand-invoked pod script, so until this schedule existed the only thing
  # standing between a broken lane and a wrong number was somebody noticing.
  # `bench-smoke` below runs the harness end to end against a corpus small
  # enough for a hosted runner -- it is not a performance measurement and must
  # never be quoted as one.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # This workspace links 276 test binaries. With the dev profile's default
  # debug info that exhausted the runner — `ld terminated with signal 7 [Bus
  # error], core dumped` — and a linker that dies for want of memory reads
  # exactly like a compile failure. Line tables are enough for a backtrace.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Optimise the TEST build, but keep debug assertions on.
  #
  # This engine's tests move real data — one repairs a table of a fifth of a
  # million entries — and at opt-level 0 a single such test ran for over a
  # minute on a two-core runner. Optimising them is not a correctness
  # compromise here: `debug-assertions` stays true, so every `always!`,
  # `debug_assert!` and overflow check this codebase leans on still fires. What
  # is dropped is only the interpreter-speed penalty on the data loops.
  CARGO_PROFILE_DEV_OPT_LEVEL: 2
  CARGO_PROFILE_TEST_OPT_LEVEL: 2
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: true
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: true

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # `review_fence_hammer`'s heavy arm is EXCLUDED here, and only here.
      #
      # It runs seven threads — four writers at 25k ops each, three readers —
      # and asserts, as its INSTRUMENT, that readers took the adjacency-table
      # path on at least half their reads. On a two-core runner the readers are
      # starved and that ratio does not hold, so the test fails with "readers
      # did not take the table path" while every CORRECTNESS assertion in it
      # passes: settled tables match the store row for row, the change log is
      # unpoisoned, the fence fired.
      #
      # So this is a test that needs real parallelism to exercise what it
      # instruments, not a flaky one, and weakening its assertion would remove
      # the thing it exists to prove. It passes locally at both opt-levels
      # (34 s at 2, 60 s at 0). Run it before trusting a change to the write
      # fence or to derived-structure publication:
      #
      #     cargo test -p engram-graph --test review_fence_hammer
      #
      # Remove this skip if CI ever moves to a runner with more cores.
      - run: cargo test --workspace -- --skip four_writers_txn_batches_maintenance
      # No `examples/` may rot: every runnable snippet the book promises is a
      # real example target, so this is what keeps the documentation honest.
      - run: cargo test --workspace --examples

  # ── The instrument's own smoke test ──────────────────────────────────
  #
  # NOT a benchmark. It asserts that the lanes RUN and that their refusals
  # still fire, on a corpus two orders of magnitude below anything measured.
  # Timings from a shared hosted runner are meaningless and are deliberately
  # not recorded: the failure this guards is a lane that stopped working, not
  # a regression in speed.
  #
  # The three read batteries need a corpus that is not in the repository, so
  # they are exercised here through their REFUSAL paths -- which is the part
  # most likely to rot, because it is the part no pod script ever reaches.
  bench-smoke:
    name: benchmark harness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: The harness and its lanes build
        run: cargo build -p engram-bench --bins
      - name: Every catalogue parses, and every family's digest is stable
        run: cargo test -p engram-bench --lib catalogue
      - name: Parameter binding and coercion hold
        run: "cargo test -p engram-bench --lib -- params:: backend::bind_tests"
      - name: A read battery still refuses to run without its parameters
        run: >-
          cargo test -p engram-bench
          --test a_read_battery_refuses_to_run_without_its_parameters
      - name: The stress lane's shapes all render
        run: cargo test -p engram-bench --bin stress
      # The regression gate is the half of the scheduled lane that has TEETH:
      # `compare` asks whether two documents may be set beside each other,
      # this asks whether the newer one got WORSE. Its direction case is the
      # one worth running here -- `Row::value` is ops/s for stress and
      # MILLISECONDS on every other lane, so a gate with the sign backwards
      # would pass every real regression on half the lanes and fail every
      # speed-up on the other half, looking green either way.
      - name: The regression gate fires, and fires in the right direction
        run: cargo test -p engram-bench --lib regression_gate
      # A catalogue nothing checks against the code is decoration: it would go
      # on stamping a digest while the lane ran something else, which is
      # exactly the claim the digest exists to make checkable.
      - name: The Graphalytics catalogue matches the kernels the lane runs
        run: cargo test -p engram-bench --bin graphalytics catalogue_agrees
      # END TO END, because every step above this one is a unit test and the
      # regression gate passed nine of them while being INERT: `--baseline b.json`
      # loaded `b.json` as a second RESULT document and the gate compared the
      # baseline with itself. Only running the whole chain found that.
      #
      # This is NOT a performance measurement and must never be quoted as one --
      # two clients for five seconds on a hosted runner. What it proves is that
      # the lane still runs, still stamps rig and fairness, still writes a
      # document the reporter accepts, and that the gate is still WIRED.
      - name: A battery runs end to end and the regression gate is live
        run: |
          set -euo pipefail
          cargo build --release -p engram-server -p engram-bench --bin harness
          STORE="$(mktemp -d)"
          # The fairness stamp must match the ENGINE, not the machine: the
          # harness refuses a run whose stamp contradicts the served width.
          ENGRAM_QUERY_PARALLELISM=1 ./target/release/engram-server 127.0.0.1:7899             --paged-dir "$STORE" --paged-cache-mb 256 --workers 2             --read-timeout-secs 0 > server.log 2>&1 &
          for _ in $(seq 1 180); do grep -q 'warmed in' server.log && break; sleep 1; done
          grep -q 'warmed in' server.log || { echo "server never warmed"; cat server.log; exit 1; }
          # Describe THIS runner rather than borrowing a rig name it has not
          # earned -- a wrong stamp compares, an absent one does not.
          RIG="ci-runner:gh-hosted:$(nproc):none:$(free -m | awk '/^Mem:/{print $2}')"
          ./target/release/harness stress 127.0.0.1:7899 balanced 2 5             --writes single --rig "$RIG" --thread-cap 1 --cache-mb 256             --keys 500 --json run.json
          # The gate must PASS against itself...
          ./target/release/harness report run.json --baseline run.json
          # ...and must FAIL on an injected regression. A gate nobody has seen
          # fail is not known to be a gate.
          python3 - <<'EOF'
          import re
          t = open('run.json').read()
          m = re.search(r'"ops_per_sec"\s*:\s*([0-9.]+)', t)
          assert m, "no ops_per_sec in the document"
          open('fast.json', 'w').write(t[:m.start(1)] + str(float(m.group(1)) * 4) + t[m.end(1):])
          EOF
          if ./target/release/harness report run.json --baseline fast.json; then
            echo "THE REGRESSION GATE DID NOT FIRE on a 4x-faster baseline"
            exit 1
          fi
          echo "regression gate fired as expected"

  gates:
    name: xtask gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # `c-deps` reads EXTRACTED package sources, and the registry cache is
      # populated as a side effect of building — so its reach becomes a
      # property of the host. A `cargo check` here got 18 of 39: every
      # `windows-*` and `wasi` package in the lock file is never built on a
      # Linux runner and so never extracted, and the gate reported them
      # UNRESOLVED rather than clean, which is the behaviour its own module
      # doc argues for.
      #
      # `cargo vendor` extracts the FULL lock file for every target without
      # building anything, so the gate sees 39 of 39 on any host.
      - name: Vendor every locked package for the c-deps gate
        run: cargo vendor --versioned-dirs --quiet "${RUNNER_TEMP}/vendor"
      # d3, c-deps, msrv, determinism, hygiene, docs. `scrub` is deliberately
      # not in `all` — it is the release lane's gate, below.
      - run: cargo xtask all
        env:
          ENGRAM_CDEPS_SRC_DIRS: ${{ runner.temp }}/vendor

  scrub:
    name: publishable tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # This job belongs to the SOURCE repository's release lane. The published
      # snapshot IS the output of `public-tree`, and it deliberately does not
      # carry the scrub gate's rules — so it cannot re-derive itself, and a job
      # that tried would be permanently red in the one place a reader is most
      # likely to look. Skipping is stated rather than silent: an absent rules
      # file must never read the same as a clean scan.
      - name: Is this the source repository?
        id: src
        run: |
          if [ -f scrub-rules.txt ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No scrub-rules.txt — this is a published snapshot,           not the source tree. The publishable-tree checks run in the source           repository, which is where the rules live."
          fi

      # Assemble the tree that would be published and prove it is clean. This
      # runs on every push, not only at release, because the cost of finding a
      # forbidden token is lowest on the commit that introduced it.
      - if: steps.src.outputs.source == 'true'
        run: cargo xtask public-tree "${RUNNER_TEMP}/engram-public"
      - if: steps.src.outputs.source == 'true'
        run: cargo xtask scrub "${RUNNER_TEMP}/engram-public"
      # The allow-list must actually carry the documentation and the workflows.
      # A tree that builds but ships no docs is the failure this asserts away.
      - name: The publishable tree carries the book and the workflows
        if: steps.src.outputs.source == 'true'
        run: |
          test -f "${RUNNER_TEMP}/engram-public/docs/book/src/SUMMARY.md"
          test -f "${RUNNER_TEMP}/engram-public/docs/book/book.toml"
          test -f "${RUNNER_TEMP}/engram-public/.github/workflows/ci.yml"
          # Without the alias the published tree cannot run one of its own
          # gates. The first public snapshot shipped without it.
          test -f "${RUNNER_TEMP}/engram-public/.cargo/config.toml"
      # Stated as a CLASS rather than as a list of names. The first cut of this
      # step named the private directories it was checking for — and `scrub`
      # failed this very file for spelling one of them, which is the gate
      # working exactly as intended. A named list would also go stale the day
      # someone adds a directory nobody thought to name here.
      - name: And leaves the private material behind
        if: steps.src.outputs.source == 'true'
        run: |
          cd "${RUNNER_TEMP}/engram-public"
          # measurements/ ships only the checked-in regression baselines.
          if [ -e measurements ]; then
            extra=$(find measurements -mindepth 1 -maxdepth 1 ! -name baselines)
            test -z "$extra" || { echo "unexpected under measurements/: $extra"; exit 1; }
          fi
          test ! -e datasets
          # The allow-list is closed, so the only dot-entries that may survive
          # are the ones that have a rule.
          for e in .[!.]*; do
            case "$e" in
              .cargo|.github|.gitignore|.gitattributes|'.[!.]*') ;;
              *) echo "unexpected dot-entry in the publishable tree: $e"; exit 1 ;;
            esac
          done

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # disallowed_methods/disallowed_types are denied in the workspace lints:
      # this is the first line on determinism, and `xtask determinism` is the
      # enforcement it cannot replace.
      - run: cargo clippy --workspace --all-targets

      # NOTE: `cargo fmt --all --check` is deliberately NOT run here yet.
      #
      # The tree has never been rustfmt-clean: 177 files differ, across code
      # nobody has asked to reformat. Adding the check without the reformat
      # would make this job permanently red, and a gate that is always red gets
      # ignored — the same reasoning that keeps `scrub` out of `xtask all`.
      #
      # The fix is one command (`cargo fmt --all`) and belongs in its own
      # commit, reviewed as the mechanical change it is. When that lands, add
      # the check back here in the same commit, so the tree and the gate become
      # true together.

  msrv:
    name: builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `cargo xtask msrv` checks every member DECLARES the same rust-version.
      # This checks the declaration is TRUE, which is the half a declaration
      # cannot do for itself.
      - name: Read the MSRV from the workspace manifest
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV is $v"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} build --workspace

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  tck:
    name: openCypher conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The ratchet lives in the test itself (MIN_PASS / MAX_FAIL), so this
      # job going green IS the claim in the README.
      - run: cargo test --release -p engram-tck --test baseline -- --nocapture
