# NO DEPENDENCIES, deliberately.
#
# This crate defines the trace that the determinism gate hashes. A dependency
# that iterates a HashMap, reduces floats in a thread-pool order, or seeds itself
# from the system clock would make that trace irreproducible from within a
# library nobody thinks to look at. The simulation lane's whole claim is that a
# seed reproduces a run; the crate the claim is measured in should not import
# anything that can quietly break it.
